<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vaultGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0A0F1D" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Glowing Background Disc -->
  <circle cx="32" cy="32" r="22" fill="url(#vaultGradient)" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Shield Outline -->
  <path d="M32 10 L48 16 V32 C48 42 41 50 32 54 C23 50 16 42 16 32 V16 Z" 
        fill="url(#shieldFill)" 
        stroke="#60A5FA" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>
        
  <!-- Checkmark / Keyhole inside Shield -->
  <path d="M26 31 L30 35 L38 25" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Small Star Highlight -->
  <circle cx="43" cy="18" r="2" fill="#93C5FD" opacity="0.8"/>
</svg>

